<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surat Untukmu</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #fce4ec; /* Warna pink pastel */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .surat {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 350px;
            width: 85%;
        }
        .ikon-hati {
            color: #e91e63;
            font-size: 40px;
            margin-bottom: 15px;
            animation: detak 1s infinite alternate;
        }
        @keyframes detak {
            from { transform: scale(1); }
            to { transform: scale(1.1); }
        }
        h1 {
            color: #d81b60;
            font-size: 22px;
            margin-top: 0;
        }
        p {
            color: #4a4a4a;
            font-size: 15px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="surat">
        <div class="ikon-hati">❤️</div>
        <h1>hai bubb keren ga???</h1>
        <p>btw semangatt yah jalanin kegiatannya,lopee yuu ✨</p>
    </div>

</body>
</html>
