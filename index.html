<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surat Untukmu</title>
    <style>
        /* GAYA UMUM */
        body {
            margin: 0;
            padding: 0;
            background-color: #fce4ec; /* Warna latar pink pastel */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            overflow: hidden; /* Mencegah scroll */
        }

        /* ----- BAGIAN KARTU HATI (Akan muncul setelah bunga) ----- */
        #heart-card-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0; /* Awalnya tidak terlihat */
            visibility: hidden;
            transition: opacity 1.5s, visibility 1.5s; /* Transisi fade in */
            z-index: 10; /* Berada di depan bunga setelah aktif */
        }

        #heart-card-screen.active {
            opacity: 1; /* Terlihat saat aktif */
            visibility: visible;
        }

        .surat {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 350px;
            width: 85%;
            animation: cardPopIn 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) 1.5s forwards; /* Animasi muncul */
            transform: scale(0);
        }

        @keyframes cardPopIn {
            to { transform: scale(1); }
        }

        .ikon-hati {
            color: #e91e63;
            font-size: 40px;
            margin-bottom: 15px;
            animation: detak 1s infinite alternate;
        }

        @keyframes detak {
            from { transform: scale(1); }
            to { transform: scale(1.1); }
        }

        h1 {
            color: #d81b60;
            font-size: 22px;
            margin-top: 0;
            margin-bottom: 10px;
        }

        p {
            color: #4a4a4a;
            font-size: 15px;
            line-height: 1.6;
            margin: 0;
        }

        /* ----- BAGIAN BUNGA-BUNGA BERMEKARAN ----- */
        #bloom-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 1; /* Awalnya terlihat */
            transition: opacity 1s, visibility 1s;
            z-index: 5;
            background-color: #fce4ec; /* Warna latar yang sama */
        }

        #bloom-screen.fade-out {
            opacity: 0;
            visibility: hidden;
        }

        /* Kontainer untuk cluster bunga */
        .flower-cluster {
            position: relative;
            width: 200px;
            height: 200px;
        }

        /* Gaya dasar sebuah bunga */
        .flower {
            position: absolute;
            transform-origin: bottom center;
            transform: scale(0); /* Awalnya tidak terlihat */
        }

        .stem {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 8px;
            height: 0; /* Awalnya tidak ada */
            background-color: #4caf50;
            border-radius: 4px;
        }

        .leaf {
            position: absolute;
            width: 30px;
            height: 15px;
            background-color: #66bb6a;
            border-radius: 15px 15px 0 0;
            opacity: 0; /* Awalnya tidak terlihat */
        }

        .petals-container {
            position: absolute;
            top: -25px; /* Offset dari ujung stem */
            left: 50%;
            transform: translateX(-50%) scale(0); /* Awalnya tidak terlihat */
            width: 60px;
            height: 60px;
        }

        .petal {
            position: absolute;
            width: 30px;
            height: 15px;
            background-color: #f06292;
            border-radius: 15px 15px 0 0;
            transform-origin: center top;
        }

        .core {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 15px;
            height: 15px;
            background-color: #ffd54f;
            border-radius: 50%;
        }

        /* Animasi */
        @keyframes stemGrow {
            to { height: 100px; }
        }

        @keyframes flowerScale {
            to { transform: translateX(-50%) scale(1); }
        }

        @keyframes leavesPop {
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes petalsBloom {
            to { transform: translateX(-50%) scale(1); }
        }

        /* -- PENERAPAN ANIMASI UNTUK 3 BUNGA -- */
        
        /* Bunga Tengah (Terbesar) */
        #flower1 { left: 50%; bottom: -50px; }
        #flower1 .stem { animation: stemGrow 1.5s cubic-bezier(0.68, -0.55, 0.27, 1.55) 0.5s forwards; }
        #flower1 .leaf1 { left: -10px; top: -50px; animation: leavesPop 1s ease-out 1.2s forwards; }
        #flower1 .leaf2 { right: -10px; top: -70px; animation: leavesPop 1s ease-out 1.3s forwards; }
        #flower1 .petals-container { top: -25px; animation: petalsBloom 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) 1.8s forwards; }

        /* Bunga Kiri */
        #flower2 { left: 10%; bottom: -30px; transform: rotate(-15deg) scale(0); }
        #flower2.active { animation: flowerScale 1s ease-out 3s forwards; } /* Muncul setelah bunga tengah */
        #flower2 .stem { animation: stemGrow 1s ease-out 3.2s forwards; }
        #flower2 .leaf1 { left: -5px; top: -40px; animation: leavesPop 1s ease-out 3.5s forwards; }
        #flower2 .petals-container { top: -25px; animation: petalsBloom 1s ease-out 3.7s forwards; }

        /* Bunga Kanan */
        #flower3 { right: 10%; bottom: -30px; transform: rotate(15deg) scale(0); }
        #flower3.active { animation: flowerScale 1s ease-out 3s forwards; } /* Muncul setelah bunga tengah */
        #flower3 .stem { animation: stemGrow 1s ease-out 3.2s forwards; }
        #flower3 .leaf2 { right: -5px; top: -40px; animation: leavesPop 1s ease-out 3.5s forwards; }
        #flower3 .petals-container { top: -25px; animation: petalsBloom 1s ease-out 3.7s forwards; }

        /* Rotasi petal untuk efek mekar */
        #flower1 .petal:nth-child(1) { transform: rotate(0deg); background-color: #f06292;}
        #flower1 .petal:nth-child(2) { transform: rotate(45deg); background-color: #e91e63;}
        #flower1 .petal:nth-child(3) { transform: rotate(90deg); background-color: #ec407a;}
        #flower1 .petal:nth-child(4) { transform: rotate(135deg); background-color: #f48fb1;}
        #flower1 .petal:nth-child(5) { transform: rotate(180deg); background-color: #f06292;}
        #flower1 .petal:nth-child(6) { transform: rotate(225deg); background-color: #e91e63;}
        #flower1 .petal:nth-child(7) { transform: rotate(270deg); background-color: #ec407a;}
        #flower1 .petal:nth-child(8) { transform: rotate(315deg); background-color: #f48fb1;}

        #flower2 .petal { background-color: #ba68c8; } /* Bunga kiri ungu */
        #flower3 .petal { background-color: #4fc3f7; } /* Bunga kanan biru */

        #flower2 .petal:nth-child(1) { transform: rotate(0deg); }
        #flower2 .petal:nth-child(2) { transform: rotate(60deg); }
        #flower2 .petal:nth-child(3) { transform: rotate(120deg); }
        #flower2 .petal:nth-child(4) { transform: rotate(180deg); }
        #flower2 .petal:nth-child(5) { transform: rotate(240deg); }
        #flower2 .petal:nth-child(6) { transform: rotate(300deg); }

        #flower3 .petal:nth-child(1) { transform: rotate(0deg); }
        #flower3 .petal:nth-child(2) { transform: rotate(60deg); }
        #flower3 .petal:nth-child(3) { transform: rotate(120deg); }
        #flower3 .petal:nth-child(4) { transform: rotate(180deg); }
        #flower3 .petal:nth-child(5) { transform: rotate(240deg); }
        #flower3 .petal:nth-child(6) { transform: rotate(300deg); }

    </style>
</head>
<body>

    <!-- HALAMAN BUNGA (Bloom) -->
    <div id="bloom-screen">
        <div class="flower-cluster">
            <!-- Bunga Tengah -->
            <div class="flower" id="flower1">
                <div class="stem">
                    <div class="leaf leaf1"></div>
                    <div class="leaf leaf2"></div>
                </div>
                <div class="petals-container">
                    <div class="petal"></div>
                    <div class="petal"></div>
                    <div class="petal"></div>
                    <div class="petal"></div>
                    <div class="petal"></div>
                    <div class="petal"></div>
                    <div class="petal"></div>
                    <div class="petal"></div>
                    <div class="core"></div>
                </div>
            </div>
            
            <!-- Bunga Kiri -->
            <div class="flower" id="flower2">
                <div class="stem">
                    <div class="leaf leaf1"></div>
                </div>
                <div class="petals-container">
                    <div class="petal"></div>
                    <div class="petal"></div>
                    <div class="petal"></div>
                    <div class="petal"></div>
                    <div class="petal"></div>
                    <div class="petal"></div>
                    <div class="core"></div>
                </div>
            </div>
            
            <!-- Bunga Kanan -->
            <div class="flower" id="flower3">
                <div class="stem">
                    <div class="leaf leaf2"></div>
                </div>
                <div class="petals-container">
                    <div class="petal"></div>
                    <div class="petal"></div>
                    <div class="petal"></div>
                    <div class="petal"></div>
                    <div class="petal"></div>
                    <div class="petal"></div>
                    <div class="core"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- HALAMAN KARTU HATI -->
    <div id="heart-card-screen">
        <div class="surat">
            <div class="ikon-hati">❤️</div>
            <h1>hai bubb keren ga???</h1>
            <p>btw semangatt yah jalanin kegiatannya,<br>lopee yuu ✨</p>
        </div>
    </div>

    <script>
        // SCRIPT UNTUK MENGATUR TRANSISI
        window.addEventListener('DOMContentLoaded', () => {
            // Aktifkan animasi untuk bunga samping setelah delay
            setTimeout(() => {
                document.getElementById('flower2').classList.add('active');
                document.getElementById('flower3').classList.add('active');
            }, 3000); // Bunga samping muncul setelah 3 detik

            // Mulai fade out halaman bunga setelah bunga-bunga mekar
            setTimeout(() => {
                document.getElementById('bloom-screen').classList.add('fade-out');
            }, 6500); // Mulai fade out setelah 6.5 detik

            // Aktifkan kartu hati
            setTimeout(() => {
                document.getElementById('heart-card-screen').classList.add('active');
            }, 7500); // Kartu hati muncul setelah 7.5 detik (menunggu fade out)
        });
    </script>

</body>
</html>
